name: Python CD

on:
  workflow_run:
    workflows: ["Python CI"]
    types:
      - completed

jobs:
  deploy-dev:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image
        run: |
          docker build -t customer-data-pipeline:dev .

      - name: Deploy to DEV
        working-directory: deploy/dev
        env:
          ENVIRONMENT: ${{ secrets.DEPLOYMENT_ENV }}
        run: |
          mkdir -p output
          docker compose run --rm customer-pipeline

      - name: DEV health check
        working-directory: deploy/dev
        run: |
          test -f output/customers_processed.csv

      - name: Show DEV output
        working-directory: deploy/dev
        run: |
          cat output/customers_processed.csv

      - name: DEV deployment successful
        run: |
          echo "Customer pipeline successfully deployed to DEV!"